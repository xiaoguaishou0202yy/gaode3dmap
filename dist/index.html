<!DOCTYPE HTML>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <title>Amap 3D</title>


  <script type="module" crossorigin src="/gaode3dmap/assets/index-XhHM5ntb.js"></script>
  <link rel="stylesheet" crossorigin href="/gaode3dmap/assets/index-Dp0o8gof.css">
</head>

<body >
  <div class="container">
    <div id="map"></div>
    
    <!-- 加载提示 -->
    <div id="loading" class="loading-overlay">
        <div class="loading-content">
            <div class="spinner"></div>
            <p>正在获取您的位置...</p>
        </div>
    </div>
  </div>
  

  <script src="js/config.js"></script>
  <script>
      // 检查 CONFIG 是否正确加载
      if (!window.CONFIG || !window.CONFIG.API_KEY) {
          console.error('CONFIG 或 API_KEY 未正确加载');
      } else {
          const script = document.createElement('script');
          script.src = `https://webapi.amap.com/maps?v=2.0&key=${window.CONFIG.API_KEY}&plugin=AMap.ControlBar,AMap.ToolBar,AMap.Geolocation,AMap.Scale`;
          script.onerror = function() {
              console.error('高德地图API脚本加载失败');
          };
          document.head.appendChild(script);
      }
  </script>

</body>
</html>
